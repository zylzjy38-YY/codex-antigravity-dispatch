[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-antigravity-dispatch"
version = "0.1.0a1"
description = "Capability-based task preparation and explicit Antigravity CLI integration probes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = {text = "MIT"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
cadispatch = "codex_antigravity_dispatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_antigravity_dispatch = ["defaults/*.json"]
